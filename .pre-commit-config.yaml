# Git hooks. Install once after cloning: make hooks
# Run on every file: pre-commit run --all-files
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
# Drupal writes config/sync itself: formatters must not rewrite the export.
exclude: ^drupal/config/sync/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]

  # Secret scanner (same tool and version as the CI job).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Commit messages follow Conventional Commits.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: phpcs
        name: PHPCS (Drupal, DrupalPractice)
        entry: scripts/hooks/drupal-tool.sh phpcs
        language: script
        files: ^drupal/(web/(modules|themes)/custom/|web/sites/default/settings\.php|scripts/)
      - id: phpstan
        name: PHPStan
        entry: scripts/hooks/drupal-tool.sh phpstan analyse --no-progress --memory-limit=1G
        language: script
        files: ^drupal/web/(modules|themes)/custom/.*\.(php|module|theme|inc|install)$
        pass_filenames: false
